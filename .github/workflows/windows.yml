name: Windows build and test
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        package: [portable, lite]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: |
          if ('${{ matrix.package }}' -eq 'lite') { ./scripts/publish-win.ps1 -FrameworkDependent }
          else { ./scripts/publish-win.ps1 }
        shell: pwsh
      - run: |
          $folder = if ('${{ matrix.package }}' -eq 'lite') { 'win-x64-lite' } else { 'win-x64' }
          ./scripts/smoke-test.ps1 -Executable "artifacts/$folder/GameActivityTracker.exe"
          # Hosted runner workspaces may use ReFS. LZX requires an NTFS volume.
          $compressed = Join-Path $env:TEMP ("GameActivityTracker.Compression." + [guid]::NewGuid())
          Copy-Item "artifacts/$folder" $compressed -Recurse
          & "$compressed/runtime/docs/compact-runtime.ps1"
          ./scripts/smoke-test.ps1 -Executable "$compressed/GameActivityTracker.exe"
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: GameActivityTracker-${{ matrix.package }}
          path: artifacts/GameActivityTracker-*.zip
          if-no-files-found: error
